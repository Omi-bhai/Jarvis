name: Build JARVIS APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack project
        run: |
          echo "" | base64 -d > p.zip
          unzip -q p.zip
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - run: cd jarvis && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: JARVIS-apk, path: jarvis/app/build/outputs/apk/debug/app-debug.apk}
